name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker compose build app

      - name: Configure Symfony environment
        run: printf "APP_ENV=test\nAPP_DEBUG=1\nAPP_SECRET=ci-secret\n" > symfony/.env

      - name: Install Composer dependencies
        run: docker compose run app composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: docker compose run app vendor/bin/phpunit tests