name: Tests

on:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker compose build app

      - name: Configure Symfony environment
        run: printf "APP_ENV=test\nAPP_DEBUG=1\nAPP_SECRET=ci-secret\nDEFAULT_URI=http://localhost\nDATABASE_URL=mysql://db_user:secret@db:3306/vending_machine?serverVersion=8.0.46&charset=utf8mb4\n" > symfony/.env

      - name: Install Composer dependencies
        run: docker compose run app composer install --no-interaction --prefer-dist

      - name: Start database
        run: docker compose up -d db --wait

      - name: Run PHPUnit
        run: docker compose run app vendor/bin/phpunit tests --coverage-cobertura=/var/www/coverage-report/cobertura.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage-report/cobertura.xml
          language: PHP
          label: PHP