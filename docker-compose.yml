
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vending-machine-app
    volumes:
      - ./:/var/www
    working_dir: /var/www
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    restart: unless-stopped
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www
    restart: unless-stopped
    networks:
      - appnet

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vending_machine
      MYSQL_USER: db_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

volumes:
  db_data:
  vendor:

networks:
  appnet:
    driver: bridge

